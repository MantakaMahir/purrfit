name: Build iOS simulator

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'ios/**'
      - 'lib/**'
      - 'assets/**'
      - 'pubspec.*'
      - '.github/workflows/build-ios.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.44.4'
          channel: stable

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Compile for the simulator
        run: flutter build ios --simulator --debug --no-pub

      - name: Launch on an iPhone simulator
        shell: bash
        run: |
          set -euo pipefail
          device=$(xcrun simctl list devices available -j | jq -re \
            '[.devices[][] | select(.name | startswith("iPhone"))] | first | .udid')
          xcrun simctl boot "$device"
          xcrun simctl bootstatus "$device" -b
          app=build/ios/iphonesimulator/Runner.app
          xcrun simctl install "$device" "$app"
          bundle_id=$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$app/Info.plist")
          xcrun simctl launch "$device" "$bundle_id"
