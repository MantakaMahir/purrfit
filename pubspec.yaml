name: purrfit
description: "An offline-first Flutter fitness companion for gentle progress at your own pace."
publish_to: 'none'
version: 1.0.3+52

environment:
  sdk: ^3.12.2
  flutter: '>=3.44.4'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.5
  flutter_local_notifications: ^19.1.0
  timezone: ^0.10.0
  flutter_timezone: ^5.1.1
  google_mobile_ads: ^9.0.0
  url_launcher: ^6.3.2
  flutter_secure_storage: ^10.0.0
  in_app_purchase: ^3.3.1
  in_app_purchase_android: ^0.5.5
  in_app_purchase_platform_interface: ^1.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  # Cupertino uses Material's text-selection controls in the web preview.
  uses-material-design: true
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope[wght].ttf

  assets:
    - assets/fonts/OFL.txt
